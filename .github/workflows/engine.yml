# The engine and the Studio off the maintainer's Mac: deliver.mjs's selftest, the Studio's selftest
# (headless Chrome, every step of the wizard) and the shortest render there is (PREVIEW, half a
# second), on Linux and on Windows. GitHub's runners carry Google Chrome; ffmpeg comes from the system's
# packages (apt, Chocolatey). The film folder sits under the one playwright-core is installed in, so
# render.mjs finds it by Node's own lookup, with no link (Windows makes none without privileges).
name: Engine

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - plugins/manovella/**
      - .github/workflows/engine.yml
  push:
    branches: [main]
    paths:
      - plugins/manovella/**
      - .github/workflows/engine.yml
  workflow_dispatch:

permissions:
  contents: read

# one run a branch: a new push cancels the one it replaces (a run is up to an hour of runners)
concurrency:
  group: engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SKILL: ${{ github.workspace }}/plugins/manovella/skills/site-promo-film
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg trash-cli
      - name: playwright-core, in a folder of its own (it drives the installed Chrome, nothing is downloaded)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null && npm i --no-audit --no-fund playwright-core
      - name: What it runs on
        run: node --version && google-chrome --version && ffmpeg -version | head -1
      - name: deliver.mjs
        run: node "$SKILL/scripts/deliver.mjs" --selftest
      - name: The Studio
        working-directory: ${{ runner.temp }}/pw
        env:
          STUDIO_TEST_IDLE: 240000   # the previews' shaders drawn in software: no GPU here
        # its products: the repositories beside this checkout, this one among them
        run: node "$SKILL/studio/selftest.mjs" --roots "$GITHUB_WORKSPACE/.." --shots "$RUNNER_TEMP/shots"
      - uses: actions/setup-python@v7   # kokoro takes Python 3.10 to 3.12; the runner's own is newer
        with:
          python-version: '3.12'
      - name: Kokoro through PyTorch, set up and telling two steps
        run: |
          node "$SKILL/scripts/voice.mjs" --setup kokoro
          S="$RUNNER_TEMP/story" && mkdir -p "$S" && cp "$SKILL"/scripts/voice.mjs "$SKILL"/scripts/narrate.mjs "$SKILL"/scripts/voice-torch.py "$S"/
          printf '%s' '{"mlx":{"model":"kokoro","voice":"af_heart"},"steps":[{"say":"Open Acme from the menu bar."},{"say":"Pick a project, and the film begins."}]}' > "$S/story.json"
          cd "$S" && node voice.mjs story.json && ffprobe -v error -show_entries format=duration -of csv=p=0 narration.wav
      - name: Half a second of the demo, rendered
        run: |
          W="$RUNNER_TEMP/pw/film/src" && mkdir -p "$W"
          cp "$SKILL"/template/promo.html "$SKILL"/template/film.js "$SKILL"/template/fx.js "$SKILL"/template/parts.js "$SKILL"/template/type.js "$SKILL"/scripts/render.mjs "$W"/
          cd "$W" && PREVIEW=1 FROM=0 TO=0.5 node render.mjs video ../preview.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height:format=duration -of compact ../preview.mp4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-studio-shots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  windows:
    if: github.event.action != 'labeled'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash   # Git Bash: the same steps as Linux's
    env:
      SKILL: ${{ github.workspace }}/plugins/manovella/skills/site-promo-film
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress > /dev/null && ffmpeg -version | head -1
      - name: playwright-core, in a folder of its own
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null && npm i --no-audit --no-fund playwright-core
      - name: What it runs on
        run: node --version && ls "/c/Program Files/Google/Chrome/Application/chrome.exe"
      - name: deliver.mjs
        run: node "$SKILL/scripts/deliver.mjs" --selftest
      - name: The Studio
        working-directory: ${{ runner.temp }}/pw
        env:
          STUDIO_TEST_IDLE: 240000
        run: node "$SKILL/studio/selftest.mjs" --roots "$GITHUB_WORKSPACE/.." --shots "$RUNNER_TEMP/shots"
      - name: Half a second of the demo, rendered
        run: |
          W="$RUNNER_TEMP/pw/film/src" && mkdir -p "$W"
          cp "$SKILL"/template/promo.html "$SKILL"/template/film.js "$SKILL"/template/fx.js "$SKILL"/template/parts.js "$SKILL"/template/type.js "$SKILL"/scripts/render.mjs "$W"/
          cd "$W" && PREVIEW=1 FROM=0 TO=0.5 node render.mjs video ../preview.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height:format=duration -of compact ../preview.mp4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-studio-shots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  # Chatterbox Turbo and Orpheus through PyTorch, on the CPU (no GPU here): about 11 GB of weights and
  # minutes a line, so only on a pull request labelled voices-large. It prints the venv's versions, the
  # pins voice-constraints-large.txt is made from, and keeps them and the takes as an artifact.
  voices-large:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'voices-large')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SKILL: ${{ github.workspace }}/plugins/manovella/skills/site-promo-film
    steps:
      - name: Room for the models (the runner's unused toolchains)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - uses: actions/setup-python@v7   # kokoro takes Python 3.10 to 3.12; the runner's own is newer
        with:
          python-version: '3.12'
      - name: Set up, and one line each
        run: node "$SKILL/scripts/voice.mjs" --setup chatterbox orpheus
      - name: Their versions
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          ~/.local/share/film-voice/venv-large/bin/python -m pip freeze | tee "$RUNNER_TEMP/out/voice-constraints-large.txt"
      - name: A story told by Chatterbox, and one by Orpheus
        run: |
          S="$RUNNER_TEMP/story" && mkdir -p "$S" && cp "$SKILL"/scripts/voice.mjs "$SKILL"/scripts/narrate.mjs "$SKILL"/scripts/voice-torch.py "$S"/
          cd "$S"
          printf '%s' '{"mlx":{"model":"chatterbox"},"steps":[{"say":"Open Acme from the menu bar. [chuckle] It is that easy."}]}' > chatterbox.json
          node voice.mjs chatterbox.json --out cb && cp cb/narration.wav "$RUNNER_TEMP/out/chatterbox.wav"
          printf '%s' '{"mlx":{"model":"orpheus","voice":"leah"},"steps":[{"say":"Open Acme from the menu bar."}]}' > orpheus.json
          node voice.mjs orpheus.json --out or && cp or/narration.wav "$RUNNER_TEMP/out/orpheus.wav"
          for f in "$RUNNER_TEMP"/out/*.wav; do echo "$f $(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f") s"; done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: voices-large
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
